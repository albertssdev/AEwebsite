<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Sermon Search</title>
    <script src="sermon_search.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* match the Sermon Index page header (Tailwind v3 blue-900 / blue-100) */
        .idx-header { background:#1e3a8a; }
        .idx-header a { color:#dbeafe; }
        .idx-header a:hover { color:#fff; }

        /* search results, Google style */
        #results a.g-title { color:#1a0dab; }
        #results a.g-title:visited { color:#681da8; }
        #results a.g-title:hover { text-decoration:underline; }
        #results .g-src { color:#202124; }
        #results .g-snip {
            color:#4d5156;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
        }
        #results .g-date { color:#70757a; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="idx-header text-white py-6 shadow-lg">
        <div class="max-w-3xl mx-auto px-6">
            <div class="flex items-center justify-between mb-3">
                <a href="https://thefaithoncedelivered.info" rel="noopener"
                   class="inline-flex items-center font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                         class="w-5 h-5 mr-2" aria-hidden="true">
                        <path d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-3v-4H8v4H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z" />
                    </svg>
                    The Faith Once Delivered
                </a>
                <a href="sermon-index.html"
                   class="flex-shrink-0 font-medium hover:underline whitespace-nowrap">Sermon Index &rarr;</a>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Sermon Search</h1>
        </div>
    </header>

    <div class="max-w-3xl mx-auto mt-8 px-6">

        <p class="mb-4">Search sermons by title, speaker, scripture, topic, or keyword</p>

        <div class="mb-4">
            <input id="searchInput" type="text" class="w-full border p-2 rounded" placeholder="Enter search term...">
        </div>

        <div class="mb-8 flex flex-wrap items-center">
            <label for="speakerSelect" class="mr-2">Speaker:</label>
            <select id="speakerSelect" class="border p-2 rounded mr-6">
                <option value="">All</option>
            </select>
            <label for="mediaSelect" class="mr-2">Show:</label>
            <select id="mediaSelect" class="border p-2 rounded mr-6">
                <option value="">Audio &amp; video</option>
                <option value="audio">Audio only</option>
                <option value="video">Video only</option>
            </select>
            <label for="sortSelect" class="mr-2">Sort by:</label>
            <select id="sortSelect" class="border p-2 rounded">
                <option value="relevance">Relevance</option>
                <option value="number-desc">Number (Newest First)</option>
                <option value="number-asc">Number (Oldest First)</option>
                <option value="title-asc">Title (A-Z)</option>
                <option value="title-desc">Title (Z-A)</option>
                <option value="speaker-asc">Speaker (A-Z)</option>
                <option value="speaker-desc">Speaker (Z-A)</option>
                <option value="date-desc">Date (Newest First)</option>
                <option value="date-asc">Date (Oldest First)</option>
            </select>
        </div>

        <p id="count" class="text-sm text-gray-500 mb-4"></p>
        <div id="results" class="space-y-7"></div>
        <div id="loading" class="hidden text-center my-4">
            Loading more sermons...
        </div>

    </div>

    <script type="module">
        // Semantic search model — loads in the background. The page works on
        // literal + fuzzy search immediately and folds in semantic results once
        // the model finishes downloading (~23 MB, cached after the first visit).
        window.__semantic = { ready: false, embed: null };
        try {
            const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
            env.allowLocalModels = false;
            const extractor = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { quantized: true });
            window.__semantic.embed = async (text) => {
                const out = await extractor(text, { pooling: "mean", normalize: true });
                return Float32Array.from(out.data);
            };
            window.__semantic.ready = true;
            window.dispatchEvent(new Event("semantic-ready"));
        } catch (e) {
            console.warn("semantic search unavailable:", e);
        }
    </script>
</body>
</html>
