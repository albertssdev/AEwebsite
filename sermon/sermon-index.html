<!DOCTYPE html>
<html lang="en" class="bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow">
  <title>Sermon Index</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Make iframes fill the available space nicely */
    .tab-content {
      height: calc(100vh - 160px); /* Adjust based on header + tab-bar height */
      min-height: 500px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-900 text-white py-6 shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between gap-4 mb-3">
        <a href="https://thefaithoncedelivered.info" rel="noopener"
           class="inline-flex items-center gap-2 text-blue-100 hover:text-white font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
               class="w-5 h-5" aria-hidden="true">
            <path d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-3v-4H8v4H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z" />
          </svg>
          Living Faith Christian Fellowship
        </a>
        <a href="./" class="shrink-0 text-blue-100 hover:text-white hover:underline font-medium whitespace-nowrap">
          &larr; Sermon Search
        </a>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Sermon Index</h1>
    </div>
  </header>

  <!-- Tabs Navigation -->
  <nav class="bg-white shadow sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex flex-wrap gap-2 py-4 overflow-x-auto">
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-blue-800 text-white hover:bg-blue-900 active:scale-95" data-tab="0">2015-2016</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="1">2017-2018</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="2">2019</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="3">2020</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="4">2021</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="5">2022</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="6">2023</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="7">2024</button>
        <button class="tab-btn px-5 py-3 font-medium rounded-lg transition-all whitespace-nowrap bg-gray-200 text-gray-700 hover:bg-gray-300" data-tab="8">2025</button>
      </div>
    </div>
  </nav>

  <!-- Tab Content Area -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
    <div id="tab-container" class="tab-content w-full bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200"></div>
  </main>

  <script>
    const urls = [
      "https://thefaithoncedelivered.info/newsermons.htm",
      "https://thefaithoncedelivered.info/2017-2018.htm",
      "https://thefaithoncedelivered.info/2019beyond.htm",
      "https://thefaithoncedelivered.info/2020Sermon.htm",
      "https://thefaithoncedelivered.info/2021Sermon.htm",
      "https://thefaithoncedelivered.info/2022Sermon.htm",
      "https://thefaithoncedelivered.info/2023Sermon.htm",
      "https://thefaithoncedelivered.info/2024Sermon.htm",
      "https://thefaithoncedelivered.info/2025Sermon.htm"
    ];

    const tabButtons = document.querySelectorAll('.tab-btn');
    const container = document.getElementById('tab-container');

    function showTab(index) {
      tabButtons.forEach(btn => {
        btn.classList.remove('bg-blue-800', 'text-white', 'hover:bg-blue-900');
        btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
      });
      tabButtons[index].classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
      tabButtons[index].classList.add('bg-blue-800', 'text-white', 'hover:bg-blue-900');

      const iframe = document.createElement('iframe');
      iframe.src = urls[index];
      iframe.className = 'w-full h-full border-0';
      iframe.title = `Sermons ${tabButtons[index].textContent}`;
      iframe.loading = "lazy";

      container.innerHTML = '';
      container.appendChild(iframe);
    }

    tabButtons.forEach((btn, index) => {
      btn.addEventListener('click', () => showTab(index));
    });

    showTab(0);
  </script>

</body>
</html>
