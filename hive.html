<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="hive-favicon.svg" />
<title>Hive</title>
<style>
  :root {
    --accent: #176b40;
    --dark: #1f2933;
    --light: #f8f9fa;
    --border: #e4e2db;
    --sidebar-bg: #f5f3ee;
    --sidebar-hover: #ebe8e0;
    --sidebar-active: #e3e9e4;
    --user-bubble: #e7f0ea;
    --assistant-bubble: #ffffff;
    --error: #b00020;
    --text-dim: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--dark);
    background: var(--light);
  }
  .shell { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0.9rem 0.7rem;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.5rem 0.9rem;
    font-weight: 700;
    color: var(--accent);
  }
  .sidebar-brand img { width: 22px; height: 22px; }
  .new-chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    width: 100%;
    padding: 0.6rem 0.8rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .new-chat-btn .plus { font-size: 1.1rem; line-height: 1; }
  .new-chat-btn:hover { filter: brightness(1.08); }
  .recents-label {
    margin: 1.1rem 0.5rem 0.4rem;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }
  .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.6rem;
    border-radius: 7px;
    cursor: pointer;
    color: var(--dark);
  }
  .recent-item:hover { background: var(--sidebar-hover); }
  .recent-item.active { background: var(--sidebar-active); }
  .recent-item .recent-text { flex: 1; min-width: 0; }
  .recent-item .recent-title {
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-item .recent-time { font-size: 0.7rem; color: var(--text-dim); }
  .recent-item .delete-btn {
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
  }
  .recent-item:hover .delete-btn { display: flex; }
  .recent-item .delete-btn:hover { background: #ddd8; color: var(--error); }
  .recents-empty { padding: 0.6rem; font-size: 0.8rem; color: var(--text-dim); }

  /* Main panel */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .icon-button {
    display: none;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 0.35rem 0.55rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .conv-title {
    flex: 1;
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  select {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--dark);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
  }
  .messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .message {
    max-width: 70ch;
    padding: 0.65rem 0.9rem;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.45;
  }
  .message.user { align-self: flex-end; background: var(--user-bubble); }
  .message.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
  .message.error { color: var(--error); border-color: var(--error); }
  .message img { max-width: 100%; border-radius: 6px; display: block; }
  .message-meta { margin-top: 0.4rem; font-size: 0.72rem; color: var(--text-dim); }
  .message.pending .message-meta { font-style: italic; }
  .composer { display: flex; gap: 0.6rem; padding: 1rem 1.25rem; border-top: 1px solid var(--border); background: #fff; }
  .composer input {
    flex: 1;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--dark);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.8rem;
  }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    font-family: inherit;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  @media (max-width: 760px) {
    .icon-button { display: inline-flex; align-items: center; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.18s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.12);
    }
    .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="hive-favicon.svg" alt="" />
        <span>Hive</span>
      </div>
      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <span class="plus">+</span> New chat
      </button>
      <div class="recents-label">Recents</div>
      <div id="recents-list" class="recents-list"></div>
    </aside>

    <div class="main">
      <header class="main-header">
        <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Toggle sidebar">☰</button>
        <div class="conv-title" id="conv-title">New chat</div>
        <select id="model-override">
          <option value="">Auto-route</option>
          <option value="anthropic">Force: Anthropic</option>
          <option value="openai">Force: OpenAI</option>
          <option value="xai">Force: xAI</option>
          <option value="google">Force: Google</option>
        </select>
      </header>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <input id="composer-input" type="text" placeholder="Ask Hive anything..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const composer = document.getElementById("composer");
  const input = document.getElementById("composer-input");
  const modelOverride = document.getElementById("model-override");
  const recentsList = document.getElementById("recents-list");
  const newChatBtn = document.getElementById("new-chat-btn");
  const convTitleEl = document.getElementById("conv-title");
  const sidebar = document.getElementById("sidebar");
  const sidebarToggle = document.getElementById("sidebar-toggle");

  let activeId = null;
  let recents = [];

  function welcomeMessage() {
    messagesEl.textContent = "";
    addMessage({
      role: "assistant",
      text: "Hi! Ask me anything — I'll classify it and route it to whichever model is best suited.",
    });
  }

  function addMessage({ role, text, meta, isError, pending }) {
    const bubble = document.createElement("div");
    bubble.className = `message ${role}` + (isError ? " error" : "") + (pending ? " pending" : "");

    const body = document.createElement("div");
    body.textContent = text;
    bubble.appendChild(body);

    if (meta) {
      const metaEl = document.createElement("div");
      metaEl.className = "message-meta";
      metaEl.textContent = meta;
      bubble.appendChild(metaEl);
    }

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addImageMessage({ src, meta }) {
    const bubble = document.createElement("div");
    bubble.className = "message assistant";

    const img = document.createElement("img");
    img.src = src;
    img.alt = "generated image";
    bubble.appendChild(img);

    if (meta) {
      const metaEl = document.createElement("div");
      metaEl.className = "message-meta";
      metaEl.textContent = meta;
      bubble.appendChild(metaEl);
    }

    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function imageSrc(content) {
    if (/^https?:\/\//i.test(content)) return content;
    return `data:image/png;base64,${content}`;
  }

  function renderAssistantEntry(entry) {
    if (entry.error) {
      addMessage({
        role: "assistant",
        text: entry.error,
        meta: entry.taskType ? `${entry.taskType} — declined/rejected by provider` : undefined,
        isError: true,
      });
      return;
    }
    if (entry.failed || !entry.content) {
      addMessage({
        role: "assistant",
        text: "All providers for this task type failed or are unconfigured.",
        meta: entry.taskType ? `${entry.taskType}: ${entry.reason}` : undefined,
        isError: true,
      });
      return;
    }
    const meta = `${entry.taskType} (${entry.reason}) → ${entry.provider}/${entry.model}`;
    if (entry.isImage) {
      addImageMessage({ src: imageSrc(entry.content), meta });
    } else {
      addMessage({ role: "assistant", text: entry.content, meta });
    }
  }

  function relativeTime(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const sec = Math.floor(diffMs / 1000);
    if (sec < 60) return "Just now";
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min}m ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}h ago`;
    const day = Math.floor(hr / 24);
    if (day === 1) return "Yesterday";
    if (day < 7) return `${day}d ago`;
    return new Date(iso).toLocaleDateString();
  }

  function renderRecents() {
    recentsList.textContent = "";
    if (recents.length === 0) {
      const empty = document.createElement("div");
      empty.className = "recents-empty";
      empty.textContent = "No conversations yet.";
      recentsList.appendChild(empty);
      return;
    }

    for (const conv of recents) {
      const item = document.createElement("div");
      item.className = "recent-item" + (conv.id === activeId ? " active" : "");
      item.dataset.id = conv.id;

      const textWrap = document.createElement("div");
      textWrap.className = "recent-text";
      const title = document.createElement("div");
      title.className = "recent-title";
      title.textContent = conv.title;
      const time = document.createElement("div");
      time.className = "recent-time";
      time.textContent = relativeTime(conv.updatedAt);
      textWrap.appendChild(title);
      textWrap.appendChild(time);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "delete-btn";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        removeConversation(conv.id);
      });

      item.appendChild(textWrap);
      item.appendChild(delBtn);
      item.addEventListener("click", () => loadConversation(conv.id));
      recentsList.appendChild(item);
    }
  }

  async function fetchRecents() {
    try {
      const res = await fetch("/api/hive/conversations?limit=50");
      if (!res.ok) return;
      recents = await res.json();
      renderRecents();
    } catch {
      // Sidebar just stays empty/stale on network failure — not worth a blocking error.
    }
  }

  function upsertRecent({ id, title, updatedAt }) {
    recents = recents.filter((c) => c.id !== id);
    recents.unshift({ id, title, updatedAt });
    renderRecents();
  }

  async function removeConversation(id) {
    if (!confirm("Delete this chat?")) return;
    try {
      await fetch(`/api/hive/conversations/${id}`, { method: "DELETE" });
    } catch {
      // best-effort
    }
    recents = recents.filter((c) => c.id !== id);
    renderRecents();
    if (id === activeId) newChat();
  }

  function newChat() {
    activeId = null;
    convTitleEl.textContent = "New chat";
    welcomeMessage();
    renderRecents();
    closeSidebarOnMobile();
    input.focus();
  }

  async function loadConversation(id) {
    try {
      const res = await fetch(`/api/hive/conversations/${id}`);
      if (res.status === 401) {
        showSessionExpired();
        return;
      }
      if (!res.ok) return;
      const conv = await res.json();

      activeId = conv.id;
      convTitleEl.textContent = conv.title;
      messagesEl.textContent = "";
      for (const m of conv.messages) {
        if (m.role === "user") {
          addMessage({ role: "user", text: m.content });
        } else {
          renderAssistantEntry(m);
        }
      }
      renderRecents();
      closeSidebarOnMobile();
    } catch {
      // leave current view as-is on network failure
    }
  }

  function showSessionExpired() {
    addMessage({ role: "assistant", text: "Session expired — reload the page to sign back in.", isError: true });
  }

  async function sendMessage(text) {
    addMessage({ role: "user", text });
    const pendingBubble = addMessage({ role: "assistant", text: "thinking...", pending: true });

    const body = { message: text };
    const forced = modelOverride.value;
    if (forced) body.model = forced;

    let data;
    try {
      const res = await fetch(`/api/hive/conversations/${activeId || "new"}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        pendingBubble.remove();
        showSessionExpired();
        return;
      }
      data = await res.json();
    } catch (err) {
      pendingBubble.remove();
      addMessage({ role: "assistant", text: `Request failed: ${err.message}`, isError: true });
      return;
    }

    pendingBubble.remove();

    const wasNew = !activeId;
    activeId = data.conversationId;
    convTitleEl.textContent = data.title;
    upsertRecent({ id: data.conversationId, title: data.title, updatedAt: new Date().toISOString() });
    if (wasNew) renderRecents();

    renderAssistantEntry(data);
  }

  composer.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendMessage(text);
  });

  newChatBtn.addEventListener("click", newChat);

  function closeSidebarOnMobile() {
    sidebar.classList.remove("open");
  }
  sidebarToggle.addEventListener("click", () => sidebar.classList.toggle("open"));

  welcomeMessage();
  renderRecents();
  fetchRecents();
</script>
</body>
</html>
